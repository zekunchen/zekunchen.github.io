# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
title                    : "Zekun Chen"
description              : "Academic homepage of Zekun Chen / 陈泽坤个人学术主页"
repository               : "zekunchen/zekunchen.github.io"
google_scholar_stats_use_cdn : true

# Used by the publication template below.
# NOTE: The GitHub Actions crawler still needs the repository secret
# GOOGLE_SCHOLAR_ID=dFJl65IAAAAJ as described in the original README.
google_scholar_id        : "dFJl65IAAAAJ"

# Google Analytics (optional)
google_analytics_id      :

# SEO Related (optional)
google_site_verification :
bing_site_verification   :
baidu_site_verification  :

# Site Author
author:
  name             : "Zekun Chen"

  # Keep the existing image path so the site will not break immediately.
  # If you want to use your own portrait, put e.g. images/profile.jpg in the
  # repository and change this line to: avatar: "images/profile.jpg"
  avatar           : "images/android-chrome-512x512.png"

  # The sidebar is shared by the English and Chinese pages, so these short
  # fields are intentionally bilingual.
  bio              : "Postdoctoral Researcher / 博士后研究员"
  location         : "Changchun, China / 中国·长春"
  employer         : "Northeast Normal University / 东北师范大学"

  pubmed           :
  googlescholar    : "https://scholar.google.de/citations?user=dFJl65IAAAAJ"
  email            : "chenzk806@nenu.edu.cn"
  researchgate     :
  uri              : "https://zekunchen.github.io"
  bitbucket        :
  codepen          :
  dribbble         :
  flickr           :
  facebook         :
  foursquare       :
  github           : "zekunchen"
  google_plus      :
  keybase          :
  instagram        :
  impactstory      :
  lastfm           :
  linkedin         :
  dblp             :
  orcid            : "https://orcid.org/0000-0002-1684-9127"
  pinterest        :
  soundcloud       :
  stackoverflow    :
  steam            :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  xing             :
  youtube          :
  wikipedia        :

# Reading Files
include:
  - .htaccess
  - _pages
  - files

exclude:
  - docs
  - google_scholar_crawler
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Asia/Shanghai

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
